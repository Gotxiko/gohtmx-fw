{{ define "index" }}
    <!doctype html>
    <html lang="{{ .lang }}">
        <head>
            <title>{{ .title }}</title>
            <link rel="stylesheet" href="/assets/styles.css" />
            <script src="/assets/scripts.js"></script>
        </head>

        <body
            class="h-screen w-full overflow-hidden p-4"
            style="border-color: hsla(0, 0%, 95%, .5); user-select: none;"
        >
            <div class="flex h-1/2 flex-row border p-8" style="border-color: hsla(0, 0%, 5%, 0.5)">
                <div class="flex h-full w-full flex-row">
                    <div class="flex w-1/2 flex-col justify-between">
                        <div class="">
                            <h1 class="text-4xl font-extralight text-black">Gotzon Álava</h1>
                            <p class="text-base font-extralight text-black">Fullstack Developer</p>
                        </div>
                        <div class="flex flex-col gap-2">
                            <p class="text-balance text-xs font-extralight text-black">
                                Fullstack developer with a passion for creating beautiful and functional applications
                                and always looking for new challenges.
                            </p>
                            <p class="w-fit text-xs font-extralight text-black">
                                <a class="block grow-line" href="mailto:gotzonalava@icloud.com">
                                    gotzonalava@icloud.com
                                </a>
                            </p>
                        </div>
                    </div>
                    <div id="hx-block" class="hx-inner-animate h-full w-1/2"></div>
                </div>
            </div>
            <div class="h-50 z-10 flex flex-row p-2">
                <div class="w-full">
                    <div class="flex w-full flex-row justify-start gap-6">
                        <button
                            hx-get="/partial/home"
                            hx-target="#hx-block"
                            hx-swap="innerHTML transition:true"
                            class="active flex grow-line cursor-pointer flex-row items-center gap-2 text-base font-extralight text-black"
                        >
                            <span class="block h-3 w-3 border border-black bg-black"></span>
                            <span class="block">Home</span>
                        </button>
                        <button
                            hx-get="/partial/portfolio"
                            hx-target="#hx-block"
                            hx-swap="innerHTML transition:true"
                            class="flex grow-line cursor-pointer flex-row items-center gap-2 text-base font-extralight text-black"
                        >
                            <span class="block h-3 w-3 border border-black"></span>
                            <span class="block">Portfolio</span>
                        </button>
                    </div>
                </div>
            </div>
        </body>
    </html>
{{ end }}
