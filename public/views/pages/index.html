{{ define "index" }}
    <!doctype html>
    <html lang="{{ .lang }}">
        <head>
            <title>{{ .title }}</title>
            <link rel="stylesheet" href="/assets/styles.css" />
            <script src="/assets/scripts.js"></script>
        </head>

        <body class="bg-gray-200">
            {{ template "header" . }}
            <div class="relative z-0 block min-h-96 w-full pt-32">
                <button
                    hx-get="partial/partial"
                    class="rounded bg-blue-500 py-2 px-4 font-bold text-white hover:bg-blue-700">
                    HTMX
                </button>
            </div>
            {{ template "footer" . }}
        </body>
    </html>
{{ end }}
