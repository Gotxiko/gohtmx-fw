{{ define "index" }}
    <!doctype html>
    <html lang="{{ .lang }}">
        <head>
            <title>{{ .title }}</title>
            <link rel="stylesheet" href="/assets/styles.css" />
            <script src="/assets/scripts.js"></script>

            <style>
                .grow-line span:last-child::after {
                    content: '';
                    display: block;
                    width: 0;
                    height: 1px;
                    background: black;
                    transition: width 0.3s ease-in-out;
                }
                .grow-line:hover span:last-child::after {
                    width: 100%;
                }
                @keyframes fade-in {
                    from {
                        opacity: 0;
                    }
                }

                @keyframes fade-out {
                    to {
                        opacity: 0;
                    }
                }

                @keyframes slide-from-right {
                    from {
                        transform: translateX(90px);
                    }
                }

                @keyframes slide-to-left {
                    to {
                        transform: translateX(-90px);
                    }
                }

                /* define animations for the old and new content */
                ::view-transition-old(slide-it) {
                    animation:
                        180ms cubic-bezier(0.4, 0, 1, 1) both fade-out,
                        600ms cubic-bezier(0.4, 0, 0.2, 1) both slide-to-left;
                }
                ::view-transition-new(slide-it) {
                    animation:
                        420ms cubic-bezier(0, 0, 0.2, 1) 90ms both fade-in,
                        600ms cubic-bezier(0.4, 0, 0.2, 1) both slide-from-right;
                }

                /* tie the view transition to a given CSS class */
                .hx-inner-animate {
                    view-transition-name: slide-it;
                }
            </style>

            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    document.querySelectorAll('button').forEach((button) => {
                        button.addEventListener('click', (e) => {
                            document.querySelectorAll('button').forEach((button) => {
                                button.querySelector('span:first-child').classList.remove('bg-black');
                            });
                            let targetElement =
                                e.target.tagName.toLowerCase() === 'button' ? e.target : e.target.parentElement;
                            targetElement.querySelector('span:first-child').classList.add('bg-black');
                        });
                    });
                });
            </script>
        </head>

        <body
            class="h-screen w-full overflow-hidden p-4"
            style="border-color: hsla(0, 0%, 95%, .5); user-select: none;"
        >
            <div class="flex h-1/2 flex-row border p-8" style="border-color: hsla(0, 0%, 5%, 0.5)">
                <div id="hx-block" class="hx-inner-animate flex h-full w-full flex-row">
                    <div class="w-1/2">
                        <h1 class="text-4xl font-extralight text-black">Gotzon Álava</h1>
                        <p class="text-base font-extralight text-black">Fullstack Developer</p>
                    </div>
                </div>
            </div>
            <div class="h-50 z-10 flex flex-row p-2">
                <div class="w-full">
                    <div class="flex w-full flex-row justify-start gap-6">
                        <button
                            hx-get="/partial/home"
                            hx-target="#hx-block"
                            hx-swap="innerHTML transition:true"
                            class="active flex grow-line cursor-pointer flex-row items-center gap-2 text-base font-extralight text-black"
                        >
                            <span class="block h-3 w-3 border border-black bg-black"></span>
                            <span class="block">Home</span>
                        </button>
                        <button
                            hx-get="/partial/portfolio"
                            hx-target="#hx-block"
                            hx-swap="innerHTML transition:true"
                            class="flex grow-line cursor-pointer flex-row items-center gap-2 text-base font-extralight text-black"
                        >
                            <span class="block h-3 w-3 border border-black"></span>
                            <span class="block">Portfolio</span>
                        </button>
                    </div>
                </div>
            </div>
        </body>
    </html>
{{ end }}
