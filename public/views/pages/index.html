{{ define "index" }}
    <!doctype html>
    <html lang="{{ .lang }}">
        <head>
            <title>{{ .title }}</title>
            <link rel="stylesheet" href="/assets/styles.css" />
            <script src="/assets/scripts.js"></script>
        </head>

        <body
            class="font-akkurat h-screen w-full overflow-hidden p-4"
            style="border-color: hsla(0, 0%, 95%, .5); user-select: none;"
        >
            <div class="flex h-1/2 flex-row border p-8" style="border-color: hsla(0, 0%, 5%, 0.5)">
                <div class="flex h-full w-full flex-row">
                    <div class="flex w-1/2 flex-col justify-between">
                        <div class="">
                            <h1 class="text-4xl font-extralight text-black">{{ .name }}</h1>
                            <p class="text-base font-extralight text-black">{{ .jobtitle }}</p>
                        </div>
                        <div class="flex flex-col gap-4">
                            <p class="text-balance text-xs font-extralight text-black">
                                {{ .about_description }}
                            </p>
                            <p class="flex w-fit flex-row gap-2 text-xs font-extralight text-black">
                                <a class="block grow-line" href="{{ .mailme_link }}">
                                    {{ .mailme }}
                                </a>
                                |
                                <a class="block grow-line" href="{{ .github_link }}">
                                    {{ .github }}
                                </a>
                            </p>
                        </div>
                    </div>
                    <div id="hx-block" class="hx-inner-animate h-full w-1/2"></div>
                </div>
            </div>
            <div class="h-50 z-10 flex flex-row p-2">
                <div class="w-full">
                    <div class="flex w-full flex-row justify-start gap-6">
                        {{ range $index, $element := .navigation }}
                            <button
                                hx-get="/partial/{{ $element.link }}"
                                hx-target="#hx-block"
                                hx-swap="innerHTML transition:true"
                                class="{{ if eq $index 0 }}
                                    active
                                {{ end }} flex grow-line cursor-pointer flex-row items-center gap-2 text-sm font-extralight text-black"
                            >
                                <span class="{{ if eq $index 0 }}bg-black{{ end }} block h-3 w-3 border"></span>
                                <span class="relative top-[2px] block">{{ $element.name }}</span>
                            </button>
                        {{ end }}
                    </div>
                </div>
            </div>
        </body>
    </html>
{{ end }}
