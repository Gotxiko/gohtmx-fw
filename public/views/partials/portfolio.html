<div
    id="hx-block"
    class="absolute top-0 left-0 z-20 h-full w-full bg-white p-4 sm:relative sm:w-1/2 sm:bg-transparent sm:p-0"
>
    <div class="grid h-full w-full grid-cols-1 grid-rows-4 gap-4 sm:grid-cols-2 sm:grid-rows-2">
        {{ range $index, $element := .projects }}
            <div
                class="group relative flex h-full w-full cursor-pointer items-center justify-center border border-black bg-white"
            >
                <img
                    class="object-fit h-[75%] grayscale-100 transition-all duration-300 ease-in-out group-hover:grayscale-0"
                    src="{{ $element.img }}"
                />
                <div
                    class="absolute bottom-0 left-0 w-full translate-y-1 text-center opacity-0 transition-all duration-300 ease-in-out group-hover:-translate-y-0 group-hover:opacity-100"
                >
                    <span class="flex w-full flex-col py-1 px-2 text-left">
                        <span class="text-xs text-gray-300">{{ $element.company }}</span>
                        <span class="text-sm text-black">{{ $element.title }}</span>
                    </span>
                </div>
            </div>
        {{ end }}
    </div>
</div>
