<div
    id="hx-block"
    class="hx-inner-animate absolute top-0 left-0 z-0 h-full w-full sm:relative sm:w-1/2"
>
    <div class="flex flex-col gap-4 text-right">
        <h2 class="text-move text-2xl font-extralight text-black">
            {{ .title }}
        </h2>
        <div class="flex flex-col gap-4">
            <div class="flex flex-col gap-2">
                <h3 class="text-move text-lg font-extralight text-black">
                    {{ .languages_title }}
                </h3>
                <div class="flex flex-row-reverse gap-4">
                    {{ range $index, $element := .languages }}
                        <div class="flex flex-col gap-2">
                            <h4
                                class="text-move text-sm font-extralight text-black"
                            >
                                {{ $element.name }}
                            </h4>
                        </div>
                    {{ end }}
                </div>
            </div>
            <div class="flex flex-col gap-2">
                <h3 class="text-move text-lg font-extralight text-black">
                    {{ .technologies_title }}
                </h3>
                <div class="flex flex-row-reverse gap-4">
                    <div class="flex flex-col gap-2">
                        {{ range $index, $element := .technologies }}
                            <h4
                                class="text-move text-sm font-extralight text-black"
                            >
                                {{ $element.name }}
                            </h4>
                        {{ end }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
