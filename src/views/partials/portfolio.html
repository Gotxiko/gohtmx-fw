<div
    id="hx-block"
    class="pointer-events-none absolute top-0 left-0 z-20 h-full w-full bg-white sm:bg-transparent sm:p-0"
>
    <div
        class="absolute right-0 grid h-full w-1/2 grid-cols-1 grid-rows-4 gap-4 p-4 sm:grid-cols-2 sm:grid-rows-2"
    >
        {{ range $index, $element := .projects }}
            <div
                class="project group pointer-events-auto relative z-50 flex h-full w-full cursor-pointer items-center justify-center border border-black bg-white"
            >
                <div
                    class="absolute top-0 left-0 z-20 h-full w-full"
                    data-index="{{ $index }}"
                ></div>
                <img
                    class="object-fit z-10 h-[75%] grayscale-100 transition-all duration-300 ease-in-out group-hover:grayscale-0"
                    src="{{ $element.img }}"
                />
                <div
                    class="pointer-events-none absolute bottom-0 left-0 z-20 translate-y-1 opacity-0 transition-all group-hover:-translate-y-0 group-hover:opacity-100"
                >
                    <span class="flex w-full flex-col py-1 px-2 text-left">
                        <span
                            class="flex flex-row items-end gap-1 text-xs text-gray-300"
                        >
                            {{ if $element.company_logo }}
                                <img
                                    class="relative bottom-[2px] w-16 opacity-25"
                                    src="/assets/img/zorraquino_logo.png"
                                    alt="Zorraquino"
                                />
                            {{ else }}
                                {{ $element.company }}
                            {{ end }}
                        </span>
                        <span class="text-sm text-blue-500">
                            {{ $element.title }}
                        </span>
                    </span>
                </div>
            </div>
        {{ end }}
    </div>
    {{ range $index, $element := .projects }}
        <div
            id="proj--{{ $index }}"
            class="pointer-events-none absolute top-0 left-0 z-0 h-full w-full opacity-0 transition-all"
        >
            {{ if $element.bg_img }}
                <img
                    class="h-full w-full object-cover opacity-20 grayscale-100"
                    src="{{ $element.bg_img }}"
                />
            {{ end }}
        </div>
    {{ end }}
</div>
