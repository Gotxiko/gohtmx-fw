{{ define "Navigation" }}
    <div class="h-50 z-40 flex hidden flex-row p-2 sm:block">
        <div class="w-full">
            <div class="flex w-full flex-row justify-start gap-6">
                {{ range $index, $item := . }}
                    <button
                        hx-get="/partial/{{ $item.link }}"
                        hx-target="#hx-block"
                        hx-swap="outerHTML transition:true"
                        class="{{ if eq $index 0 }}
                            active
                        {{ end }} flex grow-line cursor-pointer flex-row items-center gap-2 text-sm font-extralight text-black"
                    >
                        <span
                            class="{{ if eq $index 0 }}
                                bg-black
                            {{ end }} block h-3 w-3 border"
                        ></span>
                        <span class="relative top-[2px] block">
                            {{ $item.name }}
                        </span>
                    </button>
                {{ end }}
            </div>
        </div>
    </div>
{{ end }}
